name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  empaquetar:
    runs-on: macos-latest
    strategy:
      matrix:
        arch: [arm64, x64]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Verificar sintaxis
        run: |
          node --check main.js
          node --check preload.js
          node --check renderer/renderer.js

      - name: Empaquetar app (${{ matrix.arch }})
        run: |
          npx electron-packager . WAcinco \
            --platform=darwin \
            --arch=${{ matrix.arch }} \
            --out=dist \
            --overwrite \
            --app-bundle-id=mx.walter.wacinco \
            --icon=assets/icon.icns \
            --ignore="^/(dist|docs|\.github)"

      - name: Comprimir
        run: |
          cd dist
          for d in WAcinco-darwin-*; do
            zip -qry "${d}.zip" "${d}"
          done

      - uses: actions/upload-artifact@v4
        with:
          name: wacinco-macos-${{ matrix.arch }}
          path: dist/*.zip
          if-no-files-found: error

  publicar:
    needs: empaquetar
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artefactos

      - name: Publicar release
        uses: softprops/action-gh-release@v2
        with:
          files: artefactos/**/*.zip
          generate_release_notes: true

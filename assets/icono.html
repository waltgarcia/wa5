<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  html, body { margin: 0; padding: 0; background: transparent; }
  .icono {
    width: 1024px; height: 1024px;
    position: relative;
    display: flex; align-items: center; justify-content: center;
  }
  .placa {
    width: 880px; height: 880px;
    border-radius: 200px;
    background: linear-gradient(160deg, #1fd65f 0%, #0e9b5f 55%, #0b7a55 100%);
    box-shadow: inset 0 -18px 40px rgba(0,0,0,.18), inset 0 18px 40px rgba(255,255,255,.22);
    display: flex; align-items: center; justify-content: center;
    position: relative;
  }
  .globo {
    position: absolute;
    width: 520px; height: 420px;
    background: #fff;
    border-radius: 120px;
    top: 250px; left: 180px;
  }
  .globo::after {
    content: '';
    position: absolute;
    bottom: -70px; left: 96px;
    width: 0; height: 0;
    border-left: 78px solid #fff;
    border-top: 90px solid transparent;
    border-right: 0 solid transparent;
    transform: rotate(8deg);
  }
  .cinco {
    position: absolute;
    top: 268px; left: 0; right: 0;
    text-align: center;
    font-family: "SF Pro Display", -apple-system, Helvetica, sans-serif;
    font-size: 330px;
    font-weight: 800;
    line-height: 1;
    letter-spacing: -14px;
    color: #0e9b5f;
  }
</style>
</head>
<body>
  <div class="icono">
    <div class="placa">
      <div class="globo"></div>
      <div class="cinco">5</div>
    </div>
  </div>
</body>
</html>

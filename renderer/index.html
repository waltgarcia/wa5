<!DOCTYPE html>
<html lang="es">
<head>

  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'" />
  <title>WAcinco</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <aside id="barra">
    <div id="arrastre"></div>
    <div id="cuentas"></div>

    <div class="espacio"></div>
    <div id="pie">0/5</div>

  </main>
  <script src="renderer.js"></script>
